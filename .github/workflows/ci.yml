name: ci
on:
  push: { branches: [main, develop] }
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv venv
      - run: uv pip install -e ".[dev]" fastapi httpx uvicorn

      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run ruff format --check .
      - name: types
        # Whole repo, not just src/. Checking only src/ meant api/ and tests/ were never
        # type-checked, which hid a real latent bug: the /demo/overrun handler dereferenced
        # decision.reservation.id after testing only decision.allowed, where the proxy's own
        # handler correctly tests both.
        run: uv run mypy . --ignore-missing-imports

      - name: adversarial tests
        run: uv run pytest tests/adversarial -q

      # The thesis, enforced. Exits non-zero if any ceiling is breached, so a
      # regression in the enforcement path cannot merge.
      - name: enforcement replay
        run: uv run python bench/enforce/replay.py

      # Criterion 3. Fails the job if p99 overhead exceeds 15 ms.
      - name: latency budget
        run: uv run python bench/latency/measure.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
