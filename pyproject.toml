[project]
name = "fusegrid"
version = "0.0.0"
description = "LLM spend limits do not stop spending: budgets fail open and you discover the overrun on the invoice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raghuram P" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
# NOTE: in a file named pytest.ini this section must be [pytest]; inside
# pyproject.toml it must be [tool.pytest.ini_options]. Getting this wrong makes
# every setting here silently inert — a real bug observed in a production repo.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
